<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 380px; margin: 0; padding: 12px; background: #1b1d22; color: #e6e6e6; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .row { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
  button { background: #2f6fed; color: #fff; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
  button.sec { background: #3a3d45; }
  pre { background: #111317; border-radius: 6px; padding: 8px; white-space: pre-wrap; max-height: 260px; overflow: auto; font-size: 11.5px; margin: 0; }
  small { color: #9aa0aa; }
  input, select { background: #111317; color: #e6e6e6; border: 1px solid #3a3d45; border-radius: 6px; padding: 4px 6px; font: inherit; }
  input { flex: 1; min-width: 0; }
</style>
</head>
<body>
  <h1>Eldoria Autopilot</h1>
  <small id="ver">…</small>
  <div class="row">
    <button id="start">Bật autopilot</button>
    <button id="stop" class="sec">Tắt</button>
    <button id="reload" class="sec">Nạp lại bản mới</button>
  </div>
  <pre id="rep">Đang đọc…</pre>
  <div class="row">
    <select id="source"><option value="auto">Nguồn: tự chọn bản mới nhất</option><option value="local">Chỉ thư mục trên máy</option><option value="url">Chỉ URL (GitHub)</option></select>
    <input id="url" placeholder="https://…/bundle.json">
  </div>
  <script src="popup.js"></script>
</body>
</html>
